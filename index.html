<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于任务清单的联系项目</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <h1>任务清单</h1>
        <!-- 添加任务区域 -->
        <div class="add-task">
            <input type="text" id="input-task" placeholder="请输入任务名……">
            <button id="add-btn">添加</button>
        </div>
        <!-- 任务列表区域 -->
        <ul class="task-list">
            <li class="task">示例</li>
        </ul>
    </div>
    <script src="app.js"></script>
</body>

</html>
